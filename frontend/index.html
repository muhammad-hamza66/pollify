<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon set ─────────────────────────────────────────────────── -->
    <!-- ICO fallback for legacy browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- SVG (modern browsers — scales perfectly at any DPI) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG sizes for browsers that prefer explicit sizes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <!-- Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA manifest icon hint -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- ── SEO ─────────────────────────────────────────────────────────── -->
    <title>Pollify — Community Polling &amp; Voting</title>
    <meta name="description" content="Create polls, vote in real time, and discuss results with the Pollify community." />
    <meta name="theme-color" content="#0F0F14" />

    <!-- Open Graph -->
    <meta property="og:title" content="Pollify — Community Polling &amp; Voting" />
    <meta property="og:description" content="Create polls, vote in real time, and discuss results." />
    <meta property="og:image" content="/favicon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pollify" />
    <meta name="twitter:image" content="/favicon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
