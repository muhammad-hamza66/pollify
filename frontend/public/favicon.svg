<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Bar gradient: blue → violet -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0F0F14"/>

  <!-- Bar 1 (shortest, left) -->
  <rect x="4" y="19" width="6" height="10" rx="2" fill="url(#barGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Bar 2 (medium, center) -->
  <rect x="13" y="13" width="6" height="16" rx="2" fill="url(#barGrad)" filter="url(#glow)" opacity="0.97"/>

  <!-- Bar 3 (tallest, right) -->
  <rect x="22" y="6" width="6" height="23" rx="2" fill="url(#barGrad)" filter="url(#glow)"/>
</svg>
